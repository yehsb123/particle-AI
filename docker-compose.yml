services:
  postgres:
    image: postgres:16-alpine
    container_name: dm-postgres
    environment:
      POSTGRES_USER: dm
      POSTGRES_PASSWORD: dm
      POSTGRES_DB: digital_matter
    # The host port is overridable because a machine often already runs a Postgres on 5432 and
    # the bind failure names no owner. Move this and DATABASE_URL together; inside the container
    # and in CI the port is always 5432.
    ports:
      - "${DM_PG_PORT:-5432}:5432"
    volumes:
      - dm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dm -d digital_matter"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Off unless you ask for it by name: `docker compose --profile kafka up -d kafka`. The runtime
  # only talks to a broker when DM_EVENT_BUS=kafka, so nothing here starts with the default
  # `docker compose up`, and the default install has no kafka client in it either.
  #
  # One node, KRaft (no ZooKeeper), no volume: this is a broker to watch an event travel through,
  # not somewhere to keep events. What it advertises is what a client on THIS machine dials, so
  # the published port and the advertised port move together — a client told 9092 while the
  # broker answers on another is the failure that looks like a hung producer.
  #
  # Bound to loopback, not to every interface. Anyone who can write to the topic can put an event
  # into the runtime's loop, and this broker asks nobody who they are; published as `9092:9092` it
  # would offer that to every machine on the same network. A shared broker is a different thing
  # and wants SASL and a topic-write ACL — see the readme.
  kafka:
    image: apache/kafka:3.9.0
    container_name: dm-kafka
    profiles: ["kafka"]
    ports:
      - "127.0.0.1:${DM_KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:${DM_KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 20

  # The same broker, with a lock on it. Off unless you ask for it by name:
  # `docker compose --profile kafka-sasl up -d kafka-sasl`.
  #
  # The broker above asks nobody who they are, which is why it is published on loopback only and
  # why a runtime holding its HTTP callers to DM_INGEST_TOKEN refuses to point at a remote one.
  # This is the shape a shared broker has instead: a listener that speaks SASL/PLAIN, one user,
  # and a password that has to match. It is here so that "the runtime authenticates" can be
  # watched happening rather than believed, and so that a wrong password can be watched failing.
  #
  # SASL_PLAINTEXT, not SASL_SSL: the password crosses a loopback socket in the clear, which is
  # the one place that is not a mistake. On a real shared broker this listener is SASL_SSL and
  # the runtime is given DM_KAFKA_SSL=1 — see the readme.
  #
  # The password is a local default, like the postgres one above, and is overridable with the
  # same variable the runtime reads so that one value configures both ends.
  kafka-sasl:
    image: apache/kafka:3.9.0
    container_name: dm-kafka-sasl
    profiles: ["kafka-sasl"]
    ports:
      - "127.0.0.1:${DM_KAFKA_SASL_PORT:-9094}:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: SASL://:9094,CONTROLLER://:9095
      KAFKA_ADVERTISED_LISTENERS: SASL://127.0.0.1:${DM_KAFKA_SASL_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,SASL:SASL_PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9095
      KAFKA_INTER_BROKER_LISTENER_NAME: SASL
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_LISTENER_NAME_SASL_PLAIN_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="runtime" password="${DM_KAFKA_SASL_PASSWORD:-dm}" user_runtime="${DM_KAFKA_SASL_PASSWORD:-dm}";'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    # Healthy means a client that authenticates gets an answer, not that a port is open: the
    # whole point of this broker is the lock, so the probe has to put a key in it.
    healthcheck:
      test: >-
        echo 'security.protocol=SASL_PLAINTEXT' > /tmp/dm-sasl.properties
        && echo 'sasl.mechanism=PLAIN' >> /tmp/dm-sasl.properties
        && echo 'sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="runtime" password="${DM_KAFKA_SASL_PASSWORD:-dm}";' >> /tmp/dm-sasl.properties
        && /opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9094 --command-config /tmp/dm-sasl.properties --list > /dev/null
      interval: 5s
      timeout: 15s
      retries: 20

volumes:
  dm_pgdata:
