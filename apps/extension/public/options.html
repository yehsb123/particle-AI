<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Particle AI — Sensing consent</title>
<style>
  :root { --bg:#FFFFFF; --text:#1C1B1F; --muted:#605D64; --border:#E6E1E5; --border-strong:#CAC4D0; --code:#F5EFF7; --accent:#6750A4; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1C1B1F; --text:#E6E1E5; --muted:#AEA9B4; --border:#49454F; --border-strong:#49454F; --code:#313033; --accent:#D0BCFF; }
  }
  html, body { background: var(--bg); color: var(--text); }
  body { font-family: system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; max-width: 560px; margin: 32px auto; padding: 0 16px; }
  h1 { font-size: 18px; }
  label { display: flex; gap: 10px; align-items: flex-start; padding: 12px; border: 1px solid var(--border); border-radius: 12px; margin: 10px 0; }
  small { color: var(--muted); }
  code { background: var(--code); padding: 1px 6px; border-radius: 6px; }
  input[type=text] { font: inherit; padding: 6px 8px; border: 1px solid var(--border-strong); border-radius: 8px; width: 100%; background: var(--bg); color: var(--text); }
  input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
</style>
</head>
<body>
<h1 data-i18n="title">What Particle AI may sense</h1>
<p><small data-i18n="lead">Shape only — never content. Nothing leaves this machine unless you enable a remote model in the runtime.</small></p>
<label><input type="checkbox" id="interactions"> <span><b data-i18n="interactions">Interactions (L0)</b><br><small data-i18n="interactions_desc">that you clicked / scrolled / typed and when — never <em>what</em></small></span></label>
<label><input type="checkbox" id="tabs"> <span><b data-i18n="tabs">Tabs &amp; focus (L3)</b><br><small data-i18n="tabs_desc">site hostnames you navigate to and time away — never full URLs or page text</small></span></label>
<label><input type="checkbox" id="network"> <span><b data-i18n="network">Communication shape (L2) — opt-in</b><br><small data-i18n="network_desc">hostname, status code and latency of requests — never paths, queries or bodies</small></span></label>
<label><span style="flex:1"><b data-i18n="token">Runtime token (optional)</b><br><small data-i18n="token_desc">must match <code>DM_INGEST_TOKEN</code> on the runtime; leave empty if the runtime has none</small><br><input type="text" id="token" autocomplete="off" spellcheck="false"></span></label>
<label><span style="flex:1"><b data-i18n="runtimeUrl">Runtime URL</b><br><small data-i18n="runtimeUrl_desc">where events go — your own machine by default; leave empty for <code>http://localhost:8787</code></small><br><input type="text" id="runtimeUrl" autocomplete="off" spellcheck="false" placeholder="http://localhost:8787"></span></label>
<p><small><span data-i18n="runtime">Runtime</span>: <code>http://localhost:8787</code> · <span data-i18n="body">Body: side panel</span></small></p>
<script src="options.js"></script>
</body>
</html>
